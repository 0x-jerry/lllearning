[package]
name = "lllearning"
version = "0.1.0"
edition = "2024"
publish = false

[features]
inspector = []

[dependencies]
# Aliased so `gpui::` paths match what `rsx!` expansions generate.
gpui = { package = "gpui-kit", version = "0.11.0", features = ["gpui-fast"] }
gpui-rsx = "0.13.0"
gpui-webview = { version = "0.11.0", features = ["gpui-fast"] }
wry = { version = "0.53.3", package = "lb-wry" }
png = "0.18"
tray-icon = "0.26"
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[package.metadata.packager]
product-name = "lllearning"
identifier = "com.example.lllearning"
description = "GPUI Kit WebView browser with a system tray"
category = "Utility"
icons = ["assets/icon.png", "assets/icon.ico"]
before-packaging-command = "cargo build --release"
