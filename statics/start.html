<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #18181b;
    --muted: #71717a;
    --line: #e4e4e7;
    --accent: #4f46e5;
    --accent-soft: rgba(79, 70, 229, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0f;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --line: #27272a;
      --accent: #818cf8;
      --accent-soft: rgba(129, 140, 248, 0.16);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 32px;
  }
  .mark {
    width: 64px;
    height: 64px;
    margin-bottom: 20px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  p {
    margin: 8px 0 0;
    max-width: 36ch;
    color: var(--muted);
  }
  .hint {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    font-size: 13px;
    color: var(--muted);
  }
  kbd {
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    font-size: 12px;
    color: var(--fg);
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3.6 9h16.8M3.6 15h16.8"></path>
        <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path>
      </svg>
    </div>
    <h1>lllearning</h1>
    <p>Type an address in the bar above and press Enter to start browsing.</p>
    <div class="hint"><kbd>Enter</kbd> to load</div>
  </main>
</body>
</html>
